# SynthPulse fork image: multi-arch (amd64 + arm64) self-hosted nango-server.
# Upstream publishes amd64 only; the arm64 half is why this fork exists as
# part of the SynthPulse infra (Raspberry Pi / arm64 VPS hosts).
name: synthpulse-image

on:
  push:
    branches: [synthpulse]
    tags: ['synthpulse-v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read upstream version
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/synthwave-solutions/nango-base:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build server image (self-hosted CMD)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: synthpulse/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/synthwave-solutions/nango-base:${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/synthwave-solutions/nango-server:${{ steps.ver.outputs.version }}
            ghcr.io/synthwave-solutions/nango-server:latest
